<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123024">
<title>Jungle - Animal Chess</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐅</text></svg>">
</head>
<body>

<!-- ============================ MENU ============================ -->
<section id="menu" class="screen">
  <button class="langbtn" id="langBtn" data-t="lang.button">中文</button>

  <header class="brand">
    <div class="brand-icons" id="brandIcons"></div>
    <h1 id="brandTitle">Jungle</h1>
    <p class="tag" data-t="menu.tag">Animal chess &middot; free to play &middot; no sign-up</p>
  </header>

  <div class="card">
    <h2 data-t="menu.trapRule">1. Choose the trap rule</h2>
    <div class="choices" id="variantChoices">
      <label class="choice">
        <input type="radio" name="variant" value="classic" checked>
        <span class="choice-body">
          <b><span data-t="variant.classic">Classic</span></b>
          <em data-th="variant.classic.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="open">
        <span class="choice-body">
          <b><span data-t="variant.open">Open traps</span>
             <span class="badge" data-t="variant.badge1">Variation 1</span></b>
          <em data-th="variant.open.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="safe">
        <span class="choice-body">
          <b><span data-t="variant.safe">Safe traps</span>
             <span class="badge" data-t="variant.badge2">Variation 2</span></b>
          <em data-th="variant.safe.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="home">
        <span class="choice-body">
          <b><span data-t="variant.home">Home refuge</span>
             <span class="badge" data-t="variant.badge2b">Variation 2b</span></b>
          <em data-th="variant.home.desc"></em>
        </span>
      </label>
    </div>
  </div>

  <div class="card">
    <h2 data-t="menu.opponent">2. Choose your opponent</h2>

    <div class="mode-block">
      <h3 data-t="ai.title">🤖 Play the computer</h3>
      <div class="levels" id="levelChoices">
        <button class="level" data-level="easy" data-t="level.easy">Easy</button>
        <button class="level" data-level="normal" data-t="level.normal">Normal</button>
        <button class="level selected" data-level="hard" data-t="level.hard">Hard</button>
        <button class="level" data-level="insane" data-t="level.insane">Insane</button>
      </div>
      <p class="hint" id="levelHint"></p>
      <div class="side-pick">
        <span data-t="menu.playAs">Play as</span>
        <button class="pill selected" data-side="0" data-t="menu.red">🔴 Red (moves first)</button>
        <button class="pill" data-side="1" data-t="menu.black">⚫ Black</button>
      </div>
      <button class="primary" id="startAI" data-t="menu.start">Start game</button>
    </div>

    <div class="mode-block">
      <h3 data-t="local.title">👥 Two players, one device</h3>
      <button class="primary ghost" id="startLocal" data-t="local.start">Pass and play</button>
    </div>

    <div class="mode-block">
      <h3 data-t="online.title">🌍 Play a friend online</h3>
      <button class="primary" id="createRoom" data-t="online.create">Create a room</button>
      <div class="joinrow">
        <input id="joinCode" maxlength="4" data-tph="online.code" placeholder="CODE"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="primary ghost" id="joinRoom" data-t="online.join">Join</button>
      </div>
      <p class="hint" data-t="online.hint"></p>
    </div>
  </div>

  <div class="card">
    <h2 data-t="menu.pieces">3. Choose the piece markings</h2>
    <div class="styles" id="styleChoices">
      <button class="style" data-style="face">
        <span class="style-preview" data-style-preview="face"></span>
        <span class="style-name" data-t="style.face">Faces</span>
      </button>
      <button class="style" data-style="body">
        <span class="style-preview" data-style-preview="body"></span>
        <span class="style-name" data-t="style.body">Full animals</span>
      </button>
      <button class="style" data-style="zh">
        <span class="style-preview" data-style-preview="zh"></span>
        <span class="style-name" data-t="style.zh">Chinese characters</span>
      </button>
    </div>
    <p class="hint" data-t="style.note"></p>
  </div>

  <div class="card hidden" id="installCard">
    <h2 data-t="install.title">Keep it on your phone</h2>
    <p class="hint" id="installHint" data-th="install.hint"></p>
    <button class="primary" id="installBtn" data-t="install.button">Add to home screen</button>
  </div>

  <button class="linkish" id="openRules" data-t="menu.rulesLink">How to play &amp; full rules</button>
  <p class="foot" id="rankLine"></p>
</section>

<!-- ============================ GAME ============================ -->
<section id="game" class="screen hidden">
  <div class="topbar">
    <button class="icon" id="back" data-ttl="game.back" title="Back to menu">‹</button>
    <div class="status">
      <div id="statusLine"></div>
      <div id="subLine" class="sub"></div>
    </div>
    <button class="icon" id="flip" data-ttl="game.flip" title="Flip the board">⇅</button>
  </div>

  <button class="rulechip" id="ruleChip"></button>

  <div id="roomBar" class="roombar hidden">
    <span class="code"><span data-t="game.room">Room</span> <b id="roomCode">----</b></span>
    <button class="mini" id="copyLink" data-t="game.copyLink">Copy invite link</button>
    <span id="oppState" class="oppstate" data-t="game.waiting">waiting…</span>
  </div>

  <div class="captured" id="capturedTop"></div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-card">
        <div class="overlay-emoji" id="overEmoji">🏆</div>
        <h2 id="overTitle"></h2>
        <p id="overText"></p>
        <button class="primary" id="resumeBtn" data-t="over.playOn">Play on</button>
        <div class="overlay-btns">
          <button class="primary" id="againBtn" data-t="over.again">Play again</button>
          <button class="primary ghost" id="menuBtn" data-t="over.menu">Menu</button>
        </div>
        <button class="linkish" id="reviewBtn" data-t="over.review">Look back through the moves</button>
        <p id="rematchNote" class="hint hidden"></p>
      </div>
    </div>
  </div>
  <div class="captured" id="capturedBottom"></div>

  <div class="reviewbar hidden" id="reviewBar">
    <button class="mini" id="revStart" data-ttl="review.first">&#124;&#9664;</button>
    <button class="mini" id="revPrev" data-ttl="review.prev">&#9664;</button>
    <span id="revLabel"></span>
    <button class="mini" id="revNext" data-ttl="review.next">&#9654;</button>
    <button class="mini" id="revEnd" data-ttl="review.last">&#9654;&#124;</button>
    <button class="mini" id="revExit" data-t="review.done">Done</button>
  </div>

  <div class="controls">
    <button class="mini" id="undoBtn" data-t="game.undo">Undo</button>
    <button class="mini" id="hintBtn" data-t="game.hint">Hint</button>
    <button class="mini" id="styleBtn">🐯</button>
    <button class="mini" id="rulesBtn" data-t="game.rules">Rules</button>
    <button class="mini danger" id="resignBtn" data-t="game.resign">Resign</button>
  </div>

  <div class="movelog" id="moveLog"></div>
</section>

<!-- ============================ RULES ============================ -->
<div id="rulesModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeRules">×</button>
    <div id="rulesBody" data-th="rules.html"></div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/rules.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
