<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123024">
<title>Jungle - Animal Chess</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐅</text></svg>">
</head>
<body>

<!-- Pieces drawn for this game. Emoji cannot give a complete head set and looks
     different on every device; these are identical everywhere and stay sharp at
     any size. Paint is set with presentation attributes rather than CSS classes
     because a stylesheet cannot reach inside a <use> shadow tree. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="pc1" viewBox="0 0 64 64"><!-- rat: big round ears, tapered snout -->
    <circle fill="#fff" cx="14" cy="19" r="11.5"/><circle fill="#fff" cx="50" cy="19" r="11.5"/>
    <circle fill="#22303a" cx="14" cy="19" r="5.5"/><circle fill="#22303a" cx="50" cy="19" r="5.5"/>
    <ellipse fill="#fff" cx="32" cy="35" rx="17" ry="16"/>
    <ellipse fill="#fff" cx="32" cy="49" rx="8.5" ry="8"/>
    <circle fill="#22303a" cx="25" cy="33" r="3.2"/><circle fill="#22303a" cx="39" cy="33" r="3.2"/>
    <ellipse fill="#22303a" cx="32" cy="50" rx="4.2" ry="3.2"/>
  </symbol>
  <symbol id="pc2" viewBox="0 0 64 64"><!-- cat: pointed ears, whiskers -->
    <path fill="#fff" d="M13 30 L15 7 L33 20 Z"/><path fill="#fff" d="M51 30 L49 7 L31 20 Z"/>
    <path fill="#22303a" d="M18 25 L19 14 L27 21 Z"/><path fill="#22303a" d="M46 25 L45 14 L37 21 Z"/>
    <ellipse fill="#fff" cx="32" cy="36" rx="19.5" ry="17.5"/>
    <circle fill="#22303a" cx="24" cy="33" r="3.4"/><circle fill="#22303a" cx="40" cy="33" r="3.4"/>
    <path fill="#22303a" d="M32 41 l4.5 4 -4.5 3.5 -4.5 -3.5 Z"/>
    <rect fill="#22303a" x="12" y="41" width="10" height="2.4" rx="1.2" transform="rotate(-9 17 42)"/>
    <rect fill="#22303a" x="12" y="47" width="10" height="2.4" rx="1.2" transform="rotate(7 17 48)"/>
    <rect fill="#22303a" x="42" y="41" width="10" height="2.4" rx="1.2" transform="rotate(9 47 42)"/>
    <rect fill="#22303a" x="42" y="47" width="10" height="2.4" rx="1.2" transform="rotate(-7 47 48)"/>
  </symbol>
  <symbol id="pc3" viewBox="0 0 64 64"><!-- dog: floppy ears, broad muzzle -->
    <ellipse fill="#fff" cx="11" cy="35" rx="8" ry="16"/><ellipse fill="#fff" cx="53" cy="35" rx="8" ry="16"/>
    <ellipse fill="#22303a" cx="11" cy="36" rx="3.6" ry="9"/><ellipse fill="#22303a" cx="53" cy="36" rx="3.6" ry="9"/>
    <ellipse fill="#fff" cx="32" cy="33" rx="18" ry="17"/>
    <ellipse fill="#fff" cx="32" cy="47" rx="12" ry="10"/>
    <circle fill="#22303a" cx="25" cy="30" r="3.4"/><circle fill="#22303a" cx="39" cy="30" r="3.4"/>
    <ellipse fill="#22303a" cx="32" cy="43" rx="5" ry="3.8"/>
    <rect fill="#22303a" x="30.7" y="46" width="2.6" height="8" rx="1.3"/>
  </symbol>
  <symbol id="pc4" viewBox="0 0 64 64"><!-- wolf: tall pointed ears, angular muzzle -->
    <path fill="#fff" d="M9 28 L14 2 L31 18 Z"/><path fill="#fff" d="M55 28 L50 2 L33 18 Z"/>
    <path fill="#22303a" d="M15 24 L17 10 L25 19 Z"/><path fill="#22303a" d="M49 24 L47 10 L39 19 Z"/>
    <path fill="#fff" d="M32 15 L52 25 L46 44 L32 58 L18 44 L12 25 Z"/>
    <path fill="#22303a" d="M20 32 L28 30 L27 35 Z"/><path fill="#22303a" d="M44 32 L36 30 L37 35 Z"/>
    <path fill="#22303a" d="M32 42 l5 4.5 -5 4 -5 -4 Z"/>
  </symbol>
  <symbol id="pc5" viewBox="0 0 64 64"><!-- leopard: rounded ears, spots -->
    <circle fill="#fff" cx="15" cy="16" r="8"/><circle fill="#fff" cx="49" cy="16" r="8"/>
    <circle fill="#22303a" cx="15" cy="16" r="3.6"/><circle fill="#22303a" cx="49" cy="16" r="3.6"/>
    <ellipse fill="#fff" cx="32" cy="36" rx="19.5" ry="18"/>
    <circle fill="#22303a" cx="17" cy="30" r="2.9"/><circle fill="#22303a" cx="20" cy="41" r="2.9"/>
    <circle fill="#22303a" cx="47" cy="30" r="2.9"/><circle fill="#22303a" cx="44" cy="41" r="2.9"/>
    <circle fill="#22303a" cx="32" cy="23" r="2.9"/><circle fill="#22303a" cx="24" cy="49" r="2.6"/>
    <circle fill="#22303a" cx="40" cy="49" r="2.6"/>
    <circle fill="#22303a" cx="25" cy="34" r="3.4"/><circle fill="#22303a" cx="39" cy="34" r="3.4"/>
    <path fill="#22303a" d="M32 42 l4.5 4 -4.5 3.5 -4.5 -3.5 Z"/>
  </symbol>
  <symbol id="pc6" viewBox="0 0 64 64"><!-- tiger: rounded ears, bold stripes -->
    <circle fill="#fff" cx="14" cy="17" r="8.5"/><circle fill="#fff" cx="50" cy="17" r="8.5"/>
    <circle fill="#22303a" cx="14" cy="17" r="4"/><circle fill="#22303a" cx="50" cy="17" r="4"/>
    <ellipse fill="#fff" cx="32" cy="36" rx="20" ry="18.5"/>
    <rect fill="#22303a" x="30.5" y="18" width="3" height="11" rx="1.5"/>
    <rect fill="#22303a" x="22" y="20" width="3" height="9" rx="1.5" transform="rotate(-14 23.5 24)"/>
    <rect fill="#22303a" x="39" y="20" width="3" height="9" rx="1.5" transform="rotate(14 40.5 24)"/>
    <rect fill="#22303a" x="13" y="34" width="9" height="3" rx="1.5"/>
    <rect fill="#22303a" x="13" y="42" width="9" height="3" rx="1.5"/>
    <rect fill="#22303a" x="42" y="34" width="9" height="3" rx="1.5"/>
    <rect fill="#22303a" x="42" y="42" width="9" height="3" rx="1.5"/>
    <circle fill="#22303a" cx="25" cy="35" r="3.4"/><circle fill="#22303a" cx="39" cy="35" r="3.4"/>
    <path fill="#22303a" d="M32 43 l4.5 4 -4.5 3.5 -4.5 -3.5 Z"/>
  </symbol>
  <symbol id="pc7" viewBox="0 0 64 64"><!-- lion: full mane ring -->
    <g fill="#fff">
      <circle cx="32" cy="9" r="9.5"/><circle cx="48.3" cy="15.7" r="9.5"/>
      <circle cx="55" cy="32" r="9.5"/><circle cx="48.3" cy="48.3" r="9.5"/>
      <circle cx="32" cy="55" r="9.5"/><circle cx="15.7" cy="48.3" r="9.5"/>
      <circle cx="9" cy="32" r="9.5"/><circle cx="15.7" cy="15.7" r="9.5"/>
      <circle cx="32" cy="32" r="24"/>
    </g>
    <circle fill="#22303a" cx="32" cy="33" r="18.5"/>
    <circle fill="#fff" cx="32" cy="33" r="16.5"/>
    <circle fill="#22303a" cx="25.5" cy="30" r="3.1"/><circle fill="#22303a" cx="38.5" cy="30" r="3.1"/>
    <path fill="#22303a" d="M32 37.5 l4.2 3.6 -4.2 3.2 -4.2 -3.2 Z"/>
    <path fill="none" stroke="#22303a" stroke-width="2.2" stroke-linecap="round" d="M32 44.5 q0 4 -4.5 4.5"/><path fill="none" stroke="#22303a" stroke-width="2.2" stroke-linecap="round" d="M32 44.5 q0 4 4.5 4.5"/>
  </symbol>
  <symbol id="pc8" viewBox="0 0 64 64"><!-- elephant: big ears, trunk, tusks -->
    <ellipse fill="#fff" cx="10.5" cy="28" rx="12.5" ry="18"/><ellipse fill="#fff" cx="53.5" cy="28" rx="12.5" ry="18"/>
    <ellipse fill="#22303a" cx="10.5" cy="29" rx="6" ry="10.5"/><ellipse fill="#22303a" cx="53.5" cy="29" rx="6" ry="10.5"/>
    <ellipse fill="#fff" cx="32" cy="27" rx="15" ry="16"/>
    <path fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" d="M32 36 C32 46 28 50 30.5 57"/>
    <path fill="#fff" d="M21.5 40 q-4 8 -0.5 12.5 q1.5 -7 4.5 -9.5 Z"/>
    <path fill="#fff" d="M42.5 40 q4 8 0.5 12.5 q-1.5 -7 -4.5 -9.5 Z"/>
    <circle fill="#22303a" cx="24.5" cy="24" r="3"/><circle fill="#22303a" cx="39.5" cy="24" r="3"/>
  </symbol>
</svg>

<!-- ============================ MENU ============================ -->
<section id="menu" class="screen">
  <button class="langbtn" id="langBtn" data-t="lang.button">中文</button>

  <header class="brand">
    <div class="brand-icons" id="brandIcons"></div>
    <h1 id="brandTitle">Jungle</h1>
    <p class="tag" data-t="menu.tag">Animal chess &middot; free to play &middot; no sign-up</p>
  </header>

  <div class="card">
    <h2 data-t="menu.trapRule">1. Choose the trap rule</h2>
    <div class="choices" id="variantChoices">
      <label class="choice">
        <input type="radio" name="variant" value="classic" checked>
        <span class="choice-body">
          <b><span data-t="variant.classic">Classic</span></b>
          <em data-th="variant.classic.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="open">
        <span class="choice-body">
          <b><span data-t="variant.open">Open traps</span>
             <span class="badge" data-t="variant.badge1">Variation 1</span></b>
          <em data-th="variant.open.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="safe">
        <span class="choice-body">
          <b><span data-t="variant.safe">Safe traps</span>
             <span class="badge" data-t="variant.badge2">Variation 2</span></b>
          <em data-th="variant.safe.desc"></em>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="variant" value="home">
        <span class="choice-body">
          <b><span data-t="variant.home">Home refuge</span>
             <span class="badge" data-t="variant.badge2b">Variation 2b</span></b>
          <em data-th="variant.home.desc"></em>
        </span>
      </label>
    </div>
  </div>

  <div class="card">
    <h2 data-t="menu.opponent">2. Choose your opponent</h2>

    <div class="mode-block">
      <h3 data-t="ai.title">🤖 Play the computer</h3>
      <div class="levels" id="levelChoices">
        <button class="level" data-level="easy" data-t="level.easy">Easy</button>
        <button class="level" data-level="normal" data-t="level.normal">Normal</button>
        <button class="level selected" data-level="hard" data-t="level.hard">Hard</button>
        <button class="level" data-level="insane" data-t="level.insane">Insane</button>
      </div>
      <p class="hint" id="levelHint"></p>
      <div class="side-pick">
        <span data-t="menu.playAs">Play as</span>
        <button class="pill selected" data-side="0" data-t="menu.red">🔴 Red (moves first)</button>
        <button class="pill" data-side="1" data-t="menu.black">⚫ Black</button>
      </div>
      <button class="primary" id="startAI" data-t="menu.start">Start game</button>
    </div>

    <div class="mode-block">
      <h3 data-t="local.title">👥 Two players, one device</h3>
      <button class="primary ghost" id="startLocal" data-t="local.start">Pass and play</button>
    </div>

    <div class="mode-block">
      <h3 data-t="online.title">🌍 Play a friend online</h3>
      <button class="primary" id="createRoom" data-t="online.create">Create a room</button>
      <div class="joinrow">
        <input id="joinCode" maxlength="4" data-tph="online.code" placeholder="CODE"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="primary ghost" id="joinRoom" data-t="online.join">Join</button>
      </div>
      <p class="hint" data-t="online.hint"></p>
    </div>
  </div>

  <div class="card">
    <h2 data-t="menu.pieces">3. Choose the piece markings</h2>
    <div class="styles" id="styleChoices">
      <button class="style" data-style="art">
        <span class="style-name" data-t="style.art">Drawn for this game</span>
        <span class="style-preview" data-style-preview="art"></span>
      </button>
      <button class="style" data-style="face">
        <span class="style-name" data-t="style.face">Animal heads</span>
        <span class="style-preview" data-style-preview="face"></span>
      </button>
      <button class="style" data-style="body">
        <span class="style-name" data-t="style.body">Full animals</span>
        <span class="style-preview" data-style-preview="body"></span>
      </button>
      <button class="style" data-style="zh">
        <span class="style-name" data-t="style.zh">Chinese characters</span>
        <span class="style-preview" data-style-preview="zh"></span>
      </button>
    </div>
    <p class="hint" data-t="style.note"></p>
    <p class="hint small" data-t="style.stuck"></p>
  </div>

  <div class="card hidden" id="installCard">
    <h2 data-t="install.title">Keep it on your phone</h2>
    <p class="hint" id="installHint" data-th="install.hint"></p>
    <button class="primary" id="installBtn" data-t="install.button">Add to home screen</button>
  </div>

  <button class="linkish" id="openRules" data-t="menu.rulesLink">How to play &amp; full rules</button>
  <p class="foot" id="rankLine"></p>
</section>

<!-- ============================ GAME ============================ -->
<section id="game" class="screen hidden">
  <div class="topbar">
    <button class="icon" id="back" data-ttl="game.back" title="Back to menu">‹</button>
    <div class="status">
      <div id="statusLine"></div>
      <div id="subLine" class="sub"></div>
    </div>
    <button class="icon" id="flip" data-ttl="game.flip" title="Flip the board">⇅</button>
  </div>

  <button class="rulechip" id="ruleChip"></button>

  <div id="roomBar" class="roombar hidden">
    <span class="code"><span data-t="game.room">Room</span> <b id="roomCode">----</b></span>
    <button class="mini" id="copyLink" data-t="game.copyLink">Copy invite link</button>
    <span id="oppState" class="oppstate" data-t="game.waiting">waiting…</span>
  </div>

  <div class="captured" id="capturedTop"></div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-card">
        <div class="overlay-emoji" id="overEmoji">🏆</div>
        <h2 id="overTitle"></h2>
        <p id="overText"></p>
        <button class="primary" id="resumeBtn" data-t="over.playOn">Play on</button>
        <div class="overlay-btns">
          <button class="primary" id="againBtn" data-t="over.again">Play again</button>
          <button class="primary ghost" id="menuBtn" data-t="over.menu">Menu</button>
        </div>
        <button class="linkish" id="reviewBtn" data-t="over.review">Look back through the moves</button>
        <p id="rematchNote" class="hint hidden"></p>
      </div>
    </div>
  </div>
  <div class="captured" id="capturedBottom"></div>

  <div class="reviewbar hidden" id="reviewBar">
    <button class="mini" id="revStart" data-ttl="review.first">&#124;&#9664;</button>
    <button class="mini" id="revPrev" data-ttl="review.prev">&#9664;</button>
    <span id="revLabel"></span>
    <button class="mini" id="revNext" data-ttl="review.next">&#9654;</button>
    <button class="mini" id="revEnd" data-ttl="review.last">&#9654;&#124;</button>
    <button class="mini" id="revExit" data-t="review.done">Done</button>
  </div>

  <div class="controls">
    <button class="mini" id="undoBtn" data-t="game.undo">Undo</button>
    <button class="mini" id="hintBtn" data-t="game.hint">Hint</button>
    <button class="mini" id="styleBtn">🐯</button>
    <button class="mini" id="rulesBtn" data-t="game.rules">Rules</button>
    <button class="mini danger" id="resignBtn" data-t="game.resign">Resign</button>
  </div>

  <div class="movelog" id="moveLog"></div>
</section>

<!-- ============================ RULES ============================ -->
<div id="rulesModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeRules">×</button>
    <div id="rulesBody" data-th="rules.html"></div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/rules.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
